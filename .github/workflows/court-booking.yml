name: Sport Court Booking

on:
  schedule:
    # Two schedules to cover both GMT and BST, firing ~10min before midnight UK time:
    # GMT period (late Oct - late Mar): 23:50 UTC Fri = 23:50 UK Fri -> 10min to midnight
    # BST period (late Mar - late Oct): 22:50 UTC Fri = 23:50 UK Fri -> 10min to midnight
    # The Python script has its own guard: exits immediately if midnight UK is >20min away.
    - cron: '50 23 * * 5'
    - cron: '50 22 * * 5'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - bypass Saturday check and midnight wait, run immediately'
        required: false
        type: boolean
        default: false

# Prevent duplicate runs - if GitHub's cron fires twice, only one will execute
concurrency:
  group: court-booking
  cancel-in-progress: false

jobs:
  book-courts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@v4

    # Validate timing - fail fast before any slow setup
    - name: Validate timing window
      id: check_day
      run: |
        # Use UK timezone (Europe/London) which automatically handles BST/GMT
        UK_DAY_NUM=$(TZ='Europe/London' date +%u)  # 1-7 (Mon-Sun)
        UK_HOUR=$(TZ='Europe/London' date +%H)     # 00-23
        UK_OFFSET=$(TZ='Europe/London' date +%z)   # +0000 (GMT) or +0100 (BST)
        UK_DATE=$(TZ='Europe/London' date '+%Y-%m-%d %H:%M:%S %Z')
        EVENT_NAME="${{ github.event_name }}"
        EVENT_SCHEDULE="${{ github.event.schedule }}"
        TEST_MODE="${{ inputs.test_mode }}"

        echo "Event: $EVENT_NAME"
        echo "Schedule: $EVENT_SCHEDULE"
        echo "Test Mode: $TEST_MODE"
        echo "UK Time: $UK_DATE"
        echo "UK Day: $UK_DAY_NUM (5=Friday, 6=Saturday), UK Hour: $UK_HOUR, Offset: $UK_OFFSET"
        IS_VALID="false"

        # --- Test Mode - bypass all checks ---
        if [ "$TEST_MODE" = "true" ]; then
          echo "*** TEST MODE ENABLED - bypassing timing check ***"
          IS_VALID="true"
        # --- Scheduled Runs ---
        elif [ "$EVENT_NAME" = "schedule" ]; then
          # Keep both cron entries, but allow only the one that maps to ~23:50 UK local time:
          #   - GMT (+0000): expect '50 23 * * 5'
          #   - BST (+0100): expect '50 22 * * 5'
          # Also allow delayed execution into early Saturday in UK time.
          EXPECTED_SCHEDULE=""
          if [ "$UK_OFFSET" = "+0000" ]; then
            EXPECTED_SCHEDULE="50 23 * * 5"
          elif [ "$UK_OFFSET" = "+0100" ]; then
            EXPECTED_SCHEDULE="50 22 * * 5"
          fi

          IS_KNOWN_SCHEDULE="false"
          if [ "$EVENT_SCHEDULE" = "50 22 * * 5" ] || [ "$EVENT_SCHEDULE" = "50 23 * * 5" ]; then
            IS_KNOWN_SCHEDULE="true"
          fi

          IS_EXPECTED_SCHEDULE="false"
          if [ -n "$EXPECTED_SCHEDULE" ] && [ "$EVENT_SCHEDULE" = "$EXPECTED_SCHEDULE" ]; then
            IS_EXPECTED_SCHEDULE="true"
          fi

          # Friday window: only expected schedule should run.
          # Saturday early fallback: allow either known schedule in case GitHub delayed/start skew.
          if [ "$UK_DAY_NUM" = "5" ] && [ "$UK_HOUR" -ge 22 ] && [ "$IS_EXPECTED_SCHEDULE" = "true" ]; then
            IS_VALID="true"
            echo "Valid: Friday window with expected cron for UK offset ($UK_OFFSET)"
          elif [ "$UK_DAY_NUM" = "6" ] && [ "$UK_HOUR" -le 2 ] && [ "$IS_KNOWN_SCHEDULE" = "true" ]; then
            IS_VALID="true"
            echo "Valid: Saturday delayed fallback for known cron ($EVENT_SCHEDULE)"
          else
            echo "Skipping: schedule/time mismatch (offset: $UK_OFFSET, expected: $EXPECTED_SCHEDULE, got: $EVENT_SCHEDULE)"
          fi
        # --- Manual Workflow Dispatch ---
        elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          if [ "$UK_DAY_NUM" = "5" ] || [ "$UK_DAY_NUM" = "6" ]; then
            IS_VALID="true"
            echo "Valid manual run: Day $UK_DAY_NUM in UK time"
          else
            echo "Skipping manual run: Not Friday/Saturday in UK time (Day: $UK_DAY_NUM)"
          fi
        fi

        echo "IS_VALID_DAY=$IS_VALID" >> $GITHUB_ENV
        if [ "$IS_VALID" = "true" ]; then
          echo "BOOKING_DAY=Saturday" >> $GITHUB_ENV
          echo "Proceeding with booking setup..."
        else
          echo "Skipping court booking - not in valid timing window."
        fi

    # Only proceed with setup if timing is valid
    - name: Set up Python
      if: env.IS_VALID_DAY == 'true'
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # Cache pip dependencies
    - name: Cache pip dependencies
      if: env.IS_VALID_DAY == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Cache Playwright browsers
    - name: Cache Playwright browsers
      if: env.IS_VALID_DAY == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    # Install system dependencies (required for Playwright)
    - name: Install system dependencies
      if: env.IS_VALID_DAY == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2t64 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
                              libdbus-1-3 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
                              libxrandr2 libgbm1 libnspr4 libnss3 libxss1 libxtst6 libgl1

    # Install Python dependencies
    - name: Install Python dependencies
      if: env.IS_VALID_DAY == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Install Chromium browser
    - name: Install Chromium browser
      if: env.IS_VALID_DAY == 'true'
      run: playwright install chromium

    - name: Random delay before booking (1-3 minutes)
      if: env.IS_VALID_DAY == 'true'
      run: |
        DELAY_SECS=$((60 + RANDOM % 121))
        echo "Applying random delay of ${DELAY_SECS}s before booking run..."
        sleep "$DELAY_SECS"

    - name: Run booking script
      if: env.IS_VALID_DAY == 'true'
      id: booking
      env:
        LTA_USERNAME: ${{ secrets.LTA_USERNAME }}
        LTA_PASSWORD: ${{ secrets.LTA_PASSWORD }}
        LTA_USERNAME2: ${{ secrets.LTA_USERNAME2 }}
        LTA_PASSWORD2: ${{ secrets.LTA_PASSWORD2 }}
        TEST_MODE: ${{ inputs.test_mode }}
        TRIGGER_EVENT: ${{ github.event_name }}
      run: python court_booker.py

    - name: Read booking results
      if: env.IS_VALID_DAY == 'true' && always()
      id: results
      env:
        BOOKING_STEP_OUTCOME: ${{ steps.booking.outcome }}
      run: |
        if [ -f booking_results.txt ]; then
          RESULTS=$(cat booking_results.txt)
          echo "BOOKING_RESULTS<<EOF" >> $GITHUB_ENV
          echo "$RESULTS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        else
          echo "BOOKING_RESULTS=Booking run completed with outcome: ${BOOKING_STEP_OUTCOME:-unknown}. No booking_results.txt file was produced." >> $GITHUB_ENV
        fi

        if [ -s booking_subject.txt ]; then
          echo "BOOKING_SUBJECT=$(head -n 1 booking_subject.txt)" >> $GITHUB_ENV
        else
          echo "BOOKING_SUBJECT=Court Booking Results - ${BOOKING_DAY} - NO BOOKING CONFIRMED" >> $GITHUB_ENV
        fi

    - name: Decide whether to send notification email
      if: env.IS_VALID_DAY == 'true' && always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
      run: |
        python - <<'PY'
        import json
        import os
        import urllib.request
        from datetime import datetime
        from zoneinfo import ZoneInfo

        should_send = True
        reason = "default"

        event_name = os.environ.get("GITHUB_EVENT_NAME", "")
        if event_name == "schedule":
            repo = os.environ["GITHUB_REPOSITORY"]
            token = os.environ["GITHUB_TOKEN"]
            run_id = int(os.environ["GITHUB_RUN_ID"])
            run_number = int(os.environ["GITHUB_RUN_NUMBER"])
            workflow_name = os.environ["GITHUB_WORKFLOW_NAME"]

            url = f"https://api.github.com/repos/{repo}/actions/runs?event=schedule&per_page=100"
            req = urllib.request.Request(
                url,
                headers={
                    "Authorization": f"Bearer {token}",
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                },
            )
            with urllib.request.urlopen(req, timeout=20) as resp:
                data = json.load(resp)

            uk_tz = ZoneInfo("Europe/London")
            current_uk_date = datetime.now(uk_tz).date()

            for r in data.get("workflow_runs", []):
                if int(r.get("id", 0)) == run_id:
                    continue
                if int(r.get("run_number", 0)) >= run_number:
                    continue
                if r.get("name") != workflow_name:
                    continue
                if r.get("status") != "completed":
                    continue

                started_at = r.get("run_started_at") or r.get("created_at")
                if not started_at:
                    continue
                started_dt = datetime.fromisoformat(started_at.replace("Z", "+00:00")).astimezone(uk_tz)
                if started_dt.date() == current_uk_date:
                    should_send = False
                    reason = f"older scheduled run already completed today (run_id={r.get('id')})"
                    break

        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
            env.write(f"SEND_EMAIL={'true' if should_send else 'false'}\n")
            env.write(f"SEND_EMAIL_REASON={reason}\n")

        print(f"SEND_EMAIL={'true' if should_send else 'false'}")
        print(f"Reason: {reason}")
        PY

    - name: Upload screenshots
      if: env.IS_VALID_DAY == 'true' && always()
      uses: actions/upload-artifact@v4
      with:
        name: booking-screenshots-${{ github.run_id }}
        path: |
          *.png
        retention-days: 5
        compression-level: 9
        overwrite: true
        if-no-files-found: ignore

    - name: Send email notification
      if: env.IS_VALID_DAY == 'true' && always() && env.SEND_EMAIL == 'true'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "${{ env.BOOKING_SUBJECT }}"
        body: |
          Hi team,

          I've just attempted to book the courts for you. See below for the details:

          Booking Details:
          ----------------
          ${{ env.BOOKING_RESULTS }}

          Remember: If you need to cancel or change any bookings, you'll need to do that through the club website.

          Best regards,
          Off-shore Team
        to: ${{ secrets.NOTIFICATION_EMAILS }}
        from: Off-shore Team
